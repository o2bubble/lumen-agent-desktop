name: macOS Build

# macOS 构建（GitHub Actions）。本仓库是 public → macOS runner **免费不限分钟**。
#
# 触发：推送到 main，或在 Actions 页手动 Run workflow。
# 产物：当前 run 底部的 artifact「lumen-agent-desktop-macos」。
#
# ⚠️ **必须 arm64 runner** —— build.ts 整条 mac 链路硬编码 aarch64
#    （bun/rg/fd/shellcheck 下 aarch64 包；python 用 `aarch64-apple-darwin`；
#    playbook 明确"只出 arm64"）。用 x86_64 runner（macos-13）会编出 x86_64 的
#    .app，与其余 arm64 组件不匹配 → 装完起不来。
#    macos-14 / macos-15 = Apple Silicon；macos-13 = Intel；macos-latest 不保证，
#    故**显式钉版本**，且加一步架构自检。
#
#    **2026-11-10 实测**：本仓用 `macos-14` 时 job 直接 cancelled，注解是
#      `The configuration 'macos-14-arm64-us-default' is not supported`
#    （同一个 label 在 CLI 仓 11-03 还能跑）。改 `macos-15` 立即可用 ——
#    两个都是 arm64，任选其一失败时换另一个。
#
# ⚠️ 本仓库是 **public** —— Actions 日志与 artifact 对所有人可见/可下载，
#    即 mac 安装包（含完整 .app）会公开。构建只用公开 URL，无凭据泄露面。
#
# ⚠️ **claude 二进制不在这里**（2026-11-04 拆仓后）。它由
#    o2bubble/claude-code-haha-rush 用 `bun build --compile` 产出，本仓只消费。
#    所以这里多 checkout 一个公开仓，编好后用 `--claude-from` 传进来。
#    不传也能构建，但产物**没有聊天后端**（build.ts 会打印一行跳过提示）。
on:
  workflow_dispatch:
  push:
    branches: [main]

# 连推两次时取消旧的 —— 省时间，也避免 artifact 来自已被取代的代码
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64（M1）—— 见文件头，勿改成 macos-13 / macos-latest
    runs-on: macos-15
    # 完整管线：tauri 首次编译 + 9 个组件（含下载 python / portablegit）
    timeout-minutes: 90

    steps:
      - name: Checkout (GUI)
        uses: actions/checkout@v4

      # 拆仓后 claude 二进制在另一个仓。它是 public，不需要 token。
      # 若将来改成 private，这里要加 `token:` 并换成 PAT。
      - name: Checkout (claude CLI)
        uses: actions/checkout@v4
        with:
          repository: o2bubble/claude-code-haha-rush
          path: cli

      # 架构自检：不对劲就早失败，别编出 x86_64 的包还看不出来
      - name: Verify arm64 runner
        run: |
          echo "runner arch: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::需要 arm64 runner（macos-14/15），当前是 $(uname -m)"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo tauri 来自 tauri-cli；GitHub runner 每次都是干净的，故每次都要源码编译
      # （这是本 workflow 最耗时的一步，约 3-6 分钟）
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install deps
        run: |
          bun install
          cd apps/gui && bun install

      # 编 claude 二进制。产物是 cli/dist/claude（mac 无扩展名）。
      - name: Build claude binary
        run: |
          cd cli
          bun install
          bun run build/build-claude.ts

      # build.ts 完整 mac 管线：--platform macos 走 mac 分支（darwin 目标 / 系统 zip /
      # python-build-standalone 解包），--release 生成 manifest + 组件 zip
      - name: Full macOS build
        run: |
          bun run build/build.ts --platform macos --release ci-build \
            --notes "macOS CI build" \
            --claude-from cli/dist/claude

      # 产物自检：关键文件缺失直接失败，别让下游下到残缺的包
      - name: Verify artifacts
        run: |
          set -e
          APP="dist/Claude Code.app/Contents/MacOS"
          test -f "$APP/claude" || { echo "::error::缺 claude 二进制（--claude-from 没生效？）"; exit 1; }
          test -f "$APP/claude-gui-server" || { echo "::error::缺 claude-gui-server（GUI server 未内嵌）"; exit 1; }
          # 可执行位：历史上解压/打包丢过 +x，导致装完引擎起不来
          test -x "$APP/claude" || { echo "::error::claude 缺可执行位"; exit 1; }
          echo "组件 zip："
          ls -lh dist/release/ci-build/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-agent-desktop-macos
          # 只传 build.ts 打的 zip。**不要**传 dist/Claude Code.app 那棵树
          # （GitHub 自动打的目录 zip 不保留 symlink，装完起不来 —— playbook 记过）
          path: |
            dist/release/ci-build/manifest.json
            dist/release/ci-build/*.zip
          if-no-files-found: error
          retention-days: 14
