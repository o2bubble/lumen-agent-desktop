<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>演示文稿预览</title>
<style>
  :root {
    --bg: #1b1b1f;
    --fg: #d8d8dc;
    --muted: #8a8a92;
    --panel: #232327;
    --border: #34343a;
    --accent: #d9a441;
    --slide-bg: #ffffff;
  }
  html.theme-light {
    --bg: #f6f6f7;
    --fg: #26262b;
    --muted: #6b6b73;
    --panel: #ffffff;
    --border: #e0e0e4;
    --slide-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 顶栏 ── */
  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    height: 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 32%; }
  .spacer { flex: 1 1 auto; }
  .bar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    cursor: pointer;
    min-width: 28px;
  }
  .bar button:hover:not(:disabled) { border-color: var(--accent); }
  .bar button:disabled { opacity: .38; cursor: default; }
  .counter { color: var(--muted); min-width: 72px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ── 主体：左缩略图 + 右舞台 ── */
  .body { flex: 1 1 auto; display: flex; min-height: 0; }

  #thumbs {
    flex: 0 0 132px;
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 8px 6px;
  }
  #thumbs::-webkit-scrollbar { width: 8px; }
  #thumbs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .thumb {
    position: relative;
    margin-bottom: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 3px;
    overflow: hidden;
    background: var(--slide-bg);
  }
  .thumb.on { border-color: var(--accent); }
  .thumb canvas, .thumb img, .thumb > div { display: block; width: 100%; height: 100%; }
  .thumb .num {
    position: absolute; left: 2px; bottom: 1px;
    font-size: 10px; color: var(--muted);
    background: rgba(0,0,0,.5); color: #ddd;
    padding: 0 4px; border-radius: 2px;
  }

  #stageWrap {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    min-width: 0;
  }
  #stage {
    margin: auto;
    position: relative;
    flex: 0 0 auto;
    /* 宽度/高度由 JS 按缩放比例设置 */
  }
  /* 库输出固定 1280×720，用 transform 缩放 */
  #stage > * { transform-origin: top left; }

  .state {
    margin: auto; text-align: center; color: var(--muted);
    max-width: 520px; line-height: 1.9; padding: 24px;
  }
  .state b { color: var(--fg); }
  .state code {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px; font-size: 12px;
  }
  .err { color: #e5645f; }
  .spinner { color: var(--muted); }
</style>
</head>
<body>
  <div class="bar">
    <span class="name" id="name">—</span>
    <button id="prev" title="上一页 (← / PgUp)">‹</button>
    <span class="counter" id="counter">— / —</span>
    <button id="next" title="下一页 (→ / PgDn)">›</button>
    <span class="spacer"></span>
    <button id="zoomOut" title="缩小">−</button>
    <button id="zoomFit" title="适应窗口">适应</button>
    <button id="zoomIn" title="放大">+</button>
  </div>
  <div class="body">
    <div id="thumbs"></div>
    <div id="stageWrap">
      <div class="state" id="state">等待文件…</div>
      <div id="stage"></div>
    </div>
  </div>

<script type="module">
const qs = new URLSearchParams(location.search);
const PORT = qs.get("port");
const API = PORT ? "http://127.0.0.1:" + PORT : null;

const nameEl = document.getElementById("name");
const thumbsEl = document.getElementById("thumbs");
const stageWrap = document.getElementById("stageWrap");
const stage = document.getElementById("stage");
const counter = document.getElementById("counter");
const btnPrev = document.getElementById("prev");
const btnNext = document.getElementById("next");
const stateEl = () => document.getElementById("state");

/** 库输出的幻灯片尺寸写死 1280×720，缩放靠外层 CSS。 */
const SLIDE_W = 1280;
const SLIDE_H = 720;

let mod = null;          // 动态 import 的渲染库
let pres = null;         // PresentationData
let cur = 0;             // 当前页
let scale = 1;
let fitOnResize = true;  // 用户手动缩放后关掉自动适应
let handle = null;       // 当前页的 SlideHandle（切页要 dispose）
let currentFile = null;
const thumbCache = new Map();   // 页码 → 缩略图 DOM

function applyTheme(t) {
  if (t === "light") document.documentElement.classList.add("theme-light");
  else document.documentElement.classList.remove("theme-light");
}
applyTheme(qs.get("theme"));

function showState(html, isError) {
  stage.innerHTML = "";
  stage.style.display = "none";
  let d = document.getElementById("state");
  if (!d) {
    d = document.createElement("div");
    d.id = "state";
    stageWrap.appendChild(d);
  }
  d.style.display = "";
  d.className = "state" + (isError ? " err" : "");
  d.innerHTML = html;
}

function hideState() {
  const d = document.getElementById("state");
  if (d) d.style.display = "none";
  stage.style.display = "";
}

function decodeParams(b64) {
  try {
    const std = b64.replace(/-/g, "+").replace(/_/g, "/");
    let s = std;
    while (s.length % 4) s += "=";
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  } catch (e) { return null; }
}

// ── 缩放 ──
function applyScale() {
  stage.style.width = Math.round(SLIDE_W * scale) + "px";
  stage.style.height = Math.round(SLIDE_H * scale) + "px";
  const kid = stage.firstElementChild;
  if (kid) kid.style.transform = "scale(" + scale + ")";
}
function fitToWindow() {
  const availW = stageWrap.clientWidth - 32;
  const availH = stageWrap.clientHeight - 32;
  if (availW <= 0 || availH <= 0) return;
  scale = Math.min(availW / SLIDE_W, availH / SLIDE_H);
  fitOnResize = true;
  applyScale();
}
function setScale(s) {
  scale = Math.max(0.15, Math.min(3, s));
  fitOnResize = false;
  applyScale();
}

// ── 页面渲染 ──
async function renderSlide(idx) {
  if (!pres || idx < 0 || idx >= pres.slides.length) return;
  cur = idx;
  counter.textContent = (idx + 1) + " / " + pres.slides.length;
  btnPrev.disabled = idx === 0;
  btnNext.disabled = idx === pres.slides.length - 1;
  markThumbActive(idx);

  if (handle) { try { handle.dispose(); } catch (e) {} handle = null; }
  stage.innerHTML = "";

  try {
    handle = mod.renderSlide(pres, pres.slides[idx], {});
    await handle.ready;
    const el = handle.element;
    // 库固定 1280×720，外层用 transform 缩放
    el.style.transformOrigin = "top left";
    stage.appendChild(el);
    hideState();
    applyScale();
  } catch (e) {
    showState("这一页渲染失败：<code>" + esc(String(e && e.message || e)) + "</code>", true);
  }
}

function markThumbActive(idx) {
  [...thumbsEl.children].forEach((t, i) => t.classList.toggle("on", i === idx));
  const t = thumbsEl.children[idx];
  if (t) t.scrollIntoView({ block: "nearest" });
}

/**
 * 生成缩略图。用同一个 renderSlide 渲染到离屏容器，再缩到 120×68。
 *
 * 代价：每页要跑一次完整渲染。47 页实测约 1-3ms/页（文本页），
 * 带图表的页更慢 —— 所以**懒生成**：先占位，滚到附近才真正画。
 */
const thumbObserver = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const box = e.target;
    thumbObserver.unobserve(box);
    makeThumb(Number(box.dataset.idx));
  }
}, { root: thumbsEl, rootMargin: "200px" });

async function makeThumb(idx) {
  const box = thumbsEl.querySelector('[data-idx="' + idx + '"]');
  if (!box || box.dataset.done) return;
  box.dataset.done = "1";
  try {
    const th = mod.renderSlide(pres, pres.slides[idx], {});
    await th.ready;
    const holder = document.createElement("div");
    holder.style.cssText =
      "width:120px;height:68px;overflow:hidden;position:relative;background:#fff";
    const inner = th.element;
    inner.style.transformOrigin = "top left";
    inner.style.transform = "scale(" + (120 / SLIDE_W) + ")";
    holder.appendChild(inner);
    box.innerHTML = "";
    box.appendChild(holder);
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = idx + 1;
    box.appendChild(num);
    // 缩略图渲染出来的图表实例要留着（dispose 会把 DOM 清掉），
    // 这里不 dispose —— 缩略图是静态的，随面板一起销毁即可。
  } catch (e) {
    box.dataset.done = "";
  }
}

function buildThumbs() {
  thumbsEl.innerHTML = "";
  thumbCache.clear();
  pres.slides.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.dataset.idx = String(i);
    d.style.height = "68px";
    d.onclick = () => renderSlide(i);
    thumbsEl.appendChild(d);
    thumbObserver.observe(d);
  });
}

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) =>
    c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;");
}

// ── 加载 ──
async function load(file) {
  if (!file || file === currentFile) return;
  currentFile = file;
  nameEl.textContent = file.split(/[\\/]/).pop() || file;
  nameEl.title = file;

  if (!API) {
    showState("插件后台进程没有启动（缺少 <code>port</code> 参数）。", true);
    return;
  }
  const ext = (file.split(".").pop() || "").toLowerCase();
  if (ext === "ppt") {
    showState(
      "这是旧版 <b>.ppt</b> 格式，浏览器里无法解析。<br><br>" +
      "· 用 PowerPoint 打开后「另存为」<b>.pptx</b> 即可预览<br>" +
      "· 或右键文件树里的文件 →「在资源管理器中显示」，用桌面程序打开",
      true);
    return;
  }

  showState('<span class="spinner">正在加载渲染引擎…</span>');
  try {
    if (!mod) {
      const t0 = performance.now();
      mod = await import("./vendor/pptx-renderer.es.js");
      console.log("[slides] 渲染引擎加载 " + Math.round(performance.now() - t0) + "ms");
    }

    showState('<span class="spinner">正在读取文件…</span>');
    const r = await fetch(API + "/file?path=" + encodeURIComponent(file));
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ("HTTP " + r.status));
    }
    const buf = await r.arrayBuffer();

    showState('<span class="spinner">正在解析…</span>');
    const data = await mod.parseZip(buf);
    pres = await mod.buildPresentation(data);

    if (!pres.slides.length) {
      showState("这个演示文稿里没有幻灯片。", true);
      return;
    }
    buildThumbs();
    fitToWindow();
    await renderSlide(0);
  } catch (e) {
    const msg = String(e && e.message || e);
    if (/outside workspace/i.test(msg)) {
      showState("这个文件不在当前工作区内，出于安全考虑不读取。", true);
    } else if (/not found/i.test(msg)) {
      showState("文件不存在或已被移动。", true);
    } else {
      showState("解析失败：<code>" + esc(msg) + "</code>", true);
    }
  }
}

// ── 交互 ──
btnPrev.onclick = () => renderSlide(cur - 1);
btnNext.onclick = () => renderSlide(cur + 1);
document.getElementById("zoomIn").onclick = () => setScale(scale + 0.15);
document.getElementById("zoomOut").onclick = () => setScale(scale - 0.15);
document.getElementById("zoomFit").onclick = () => fitToWindow();

document.addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); renderSlide(cur - 1); }
  else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); renderSlide(cur + 1); }
  else if (e.key === "Home") { e.preventDefault(); renderSlide(0); }
  else if (e.key === "End") { e.preventDefault(); renderSlide(pres ? pres.slides.length - 1 : 0); }
});

window.addEventListener("resize", () => { if (fitOnResize) fitToWindow(); });

window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || typeof d !== "object" || d.source !== "plugin:host") return;
  if (d.kind === "theme") { applyTheme(d.payload && d.payload.theme); return; }
  if (d.kind === "params" && d.payload) load(d.payload.file);
});

const initial = qs.get("params") ? decodeParams(qs.get("params")) : null;
if (initial) load(initial.file);
else showState("从左侧文件树双击一个 <b>.pptx</b> 文件即可预览。");
</script>
</body>
</html>
